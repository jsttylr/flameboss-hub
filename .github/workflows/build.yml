name: build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build all platforms
        run: |
          mkdir -p dist
          V="${GITHUB_REF_NAME}"
          build() {
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w -X main.version=$V" -o "dist/$3" .
          }
          build windows amd64 flameboss-hub.exe
          (cd dist && zip -q -j flameboss-hub-windows.zip flameboss-hub.exe ../README.md ../LICENSE && rm flameboss-hub.exe)
          build darwin arm64 flameboss-hub-mac-apple-silicon
          build darwin amd64 flameboss-hub-mac-intel
          build linux amd64 flameboss-hub-linux
          build linux arm64 flameboss-hub-raspberry-pi
      - uses: actions/upload-artifact@v4
        with:
          name: flameboss-hub
          path: dist/*
      - name: Attach downloads to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
